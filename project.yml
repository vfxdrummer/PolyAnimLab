name: PolyAnimLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  PolyAnimLab:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PolyAnim Lab
        # Static launch screen = same blue + same logo image as HelmetLaunchView → seamless handoff
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIUserInterfaceStyle: Dark
        # Required for >60Hz Core Animation / CADisplayLink on ProMotion iPhones
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
